version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lifebridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifebridge_db
      POSTGRES_USER: lifebridge_user
      POSTGRES_PASSWORD: lifebridge_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifebridge_user -d lifebridge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
